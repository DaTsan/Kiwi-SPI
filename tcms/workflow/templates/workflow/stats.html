<div class="workflow-stats">
  <div><strong>{{ stats.total }}</strong><span>Tests</span></div>
  <div class="workflow-positive"><strong>{{ stats.passed }}</strong><span>Passed</span></div>
  <div class="workflow-negative"><strong>{{ stats.failed }}</strong><span>Negative results</span></div>
  <div><strong>{{ stats.untested }}</strong><span>Not completed</span></div>
  <div><strong>{{ stats.percent }}%</strong><span>Complete</span></div>
</div>
<p class="workflow-muted">Custom statuses follow Kiwi weights: positive, negative, or zero (not completed).</p>
