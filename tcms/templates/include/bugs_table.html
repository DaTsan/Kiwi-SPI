{% load i18n %}
{% load static %}

<div class="col-xs-12 col-sm-6 col-md-4 bugs-table{% if block_id %} layout-block {% if block_id in disabled_layout_blocks %}layout-block-disabled-init{% endif %}{% endif %}" data-no-records-found-text="{% trans 'No records found' %}"{% if block_id %} data-layout-block="{{ block_id }}" data-layout-title="{{ block_title|default:heading }}"{% endif %}>
    <div class="card-pf card-pf-accented">
        <h2 class="card-pf-title">
            <span class="fa fa-bug"></span>
            {{ heading }}
        </h2>

        <div class="card-pf-body">
            <table class="table {{ class }}">
                <thead>
                    <tr>
                        <th colspan="2">{% trans 'URL' %}</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>
